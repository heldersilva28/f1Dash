<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="F1 Dash">
<meta name="theme-color" content="#05070A">
<title>F1 Dash — segundo monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="palco"><div id="ecra"></div></div>

<div id="definicoes" hidden>
  <div class="def-caixa">
    <h2>Definições</h2>
    <label>Ecrã
      <select id="def-ecra">
        <option value="auto">Automático (pela sessão do jogo)</option>
        <option value="corrida">Corrida</option>
        <option value="qualificacao">Qualificação</option>
        <option value="treinos">Treinos livres</option>
      </select>
    </label>
    <label>Vista
      <select id="def-vista">
        <option value="auto">Automática (volante no tablet, compacta no telemóvel)</option>
        <option value="completa">Completa (monitor)</option>
        <option value="volante">Volante (tablet deitado)</option>
        <option value="compacta">Compacta (telemóvel)</option>
      </select>
    </label>
    <label>Voltas da corrida neste circuito — deixa vazio para ser automático
      <input id="def-voltas" type="number" min="1" max="99" placeholder="automático">
    </label>
    <p id="def-aviso" class="f14 c-verm2" style="margin:0" hidden></p>
    <div class="def-botoes">
      <button type="button" id="def-guardar">Guardar</button>
      <button type="button" id="def-fechar" class="sec">Fechar</button>
    </div>
  </div>
</div>
<button type="button" id="abrir-resumo" hidden>Resumo da sessão</button>
<button type="button" id="abrir-def" aria-label="Definições">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
</button>
<script src="carro.js"></script>
<script src="app.js"></script>
<script src="volante.js"></script>
</body>
</html>
