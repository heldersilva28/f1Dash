name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Testes
        run: python -m unittest discover -s testes -v

  javascript:
    name: Sintaxe do painel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar app.js e carro.js
        run: |
          node --check web/app.js
          node --check web/carro.js
